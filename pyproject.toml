[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyter-storage-usage"
version = "0.1.1"
description = "Jupyter server extension: monitor and report home-directory storage usage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jupyter-server>=2.0",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["jupyter_storage_usage"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_storage_usage/jupyter_server_config.d/jupyter_storage_usage.json" = "etc/jupyter/jupyter_server_config.d/jupyter_storage_usage.json"
"jupyter_storage_usage/static" = "share/jupyter/jupyter_storage_usage/static"

[tool.hatch.build.targets.sdist]
include = ["jupyter_storage_usage", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
